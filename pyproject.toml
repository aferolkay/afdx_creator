[project]
name = "afdx-generator"
version = "0.1.0"
description = "Generate OMNeT++ AFDX network simulations from a topology graph and a virtual-link table"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
afdx-generator = "afdx_generator.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["afdx_generator*"]

[tool.setuptools.package-data]
afdx_generator = ["codegen/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
